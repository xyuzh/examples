# GPU diagnostics job configuration
# Run GPU health and NCCL communication tests on a Ray cluster

name: stop-time-diagnostics

# Use a base image with CUDA support
# image_uri: anyscale/ray:2.43.0-slim-py312-cu125

compute_config:
  worker_nodes:
    - instance_type: g5.12xlarge
      min_nodes: 0
      max_nodes: 2
  min_resources:
    CPU: 0
    GPU: 0
  max_resources:
    CPU: 96
    GPU: 8

working_dir: .

env_vars:
  NCCL_P2P_DISABLE: "1"
  NCCL_SHM_DISABLE: "1"

# Run diagnostics on 4 GPUs by default
entrypoint: uv run --isolated main.py --num-gpus 4

max_retries: 0
